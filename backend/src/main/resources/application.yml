spring:
  application:
    name: mimascota
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/mimascota}
    username: ${DB_USER:mimascota}
    password: ${DB_PASSWORD:mimascota}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1030}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

server:
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false

mimascota:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-ttl: 15m
    refresh-ttl: 30d
    cookie-secure: ${COOKIE_SECURE:true}
  mail:
    from: ${MAIL_FROM:MiMascota <no-reply@mimascota.local>}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
